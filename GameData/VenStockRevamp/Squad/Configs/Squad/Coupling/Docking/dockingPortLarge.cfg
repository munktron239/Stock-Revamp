@PART[dockingPortLarge]:NEEDS[!Restock] {
	@author = Ven
	!mesh = DELETE
	MODEL
	{
		model = VenStockRevamp/Squad/Parts/DockingPorts/SRDockingPort
		scale = 1.0, 1.08, 1.0
	}
	%rescaleFactor = 1
	MODULE
	{
		name = ModuleLight
		lightName = Spotlight
		useAnimationDim = true
		lightBrightenSpeed = .3
		lightDimSpeed = .4
		resourceAmount = 0.04
