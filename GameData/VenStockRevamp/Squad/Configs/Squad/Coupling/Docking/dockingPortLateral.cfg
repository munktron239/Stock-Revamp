@PART[dockingPortLateral]:NEEDS[!Restock] {
	@author = Ven
	!mesh = DELETE
	MODEL
	{
		model = VenStockRevamp/Squad/Parts/DockingPorts/InlineDockingPort
	}
	@node_stack_top = 0.0, 0.6455226, 0.0, 0, 1, 0, 1
	@node_stack_bottom = 0.0, -0.6455226, 0.0, 0, -1, 0, 1
	%rescaleFactor = 1
	MODULE
	{
		name = ModuleLight
		lightName = Spotlight
		useAnimationDim = true
		lightBrightenSpeed = .3
		lightDimSpeed = .4
		resourceAmount = 0.04
		animationName = dockingporthull-light
		useResources = true
	}
	MODULE
	{
		name = ModuleAnimateGeneric
		animationName = dockingporthull_bumper
		isOneShot = false
		startEventGUIName = Deploy bumper
		endEventGUIName = Retract bumper
	}
	@MODULE[ModuleDockingNode]
	{
		@canRotate = False
		!rotationTransformName = DELETE
		!maxMotorOutput = DELETE
		!RESOURCE[ElectricCharge] {}
		!rotationAxis = DELETE
	}
}
