@PART[miniLandingLeg]:NEEDS[!Restock] {
	@author = Ven
	!mesh = DELETE
	MODEL
	{
		model = VenStockRevamp/Squad/Parts/LandingLegs/LT-5
	}
	@MODULE[ModuleWheelBase]
	{
		@groundHeightOffset = 1
	}
	@MODULE[ModuleWheelSuspension]
	{
		@suspensionDistance = 0.76
		@suspensionOffset = -0.76
	}
	@MODULE[ModuleWheelDeployment]
	{
		@TsubSys = 1
	}
	MODULE
	{
		name = ModuleWheelBogey
		baseModuleIndex = 0
		bogeyTransformName = Foot
		deployModuleIndex = 2
		maxPitch = 160
		minPitch = -160
		restPitch = 0
		pitchResponse = 100
		bogeyAxis = 0, 0, 1
		bogeyUpAxis = 0, 1, 0
	}
	MODULE
	{
		name = FXModuleLookAtConstraint
		CONSTRAINLOOKFX
		{
			targetName = Piston1
			rotatorsName = Piston2
		}
		CONSTRAINLOOKFX
		{
			targetName = Piston2
			rotatorsName = Piston1
		}
		CONSTRAINLOOKFX
		{
			targetName = Piston3
			rotatorsName = Piston4
		}
		CONSTRAINLOOKFX
		{
			targetName = Piston4
			rotatorsName = Piston3
		}
		CONSTRAINLOOKFX
		{
			targetName = Piston6
			rotatorsName = Piston5
		}
		CONSTRAINLOOKFX
		{
			targetName = Piston5
			rotatorsName = Piston6
		}
	}
}