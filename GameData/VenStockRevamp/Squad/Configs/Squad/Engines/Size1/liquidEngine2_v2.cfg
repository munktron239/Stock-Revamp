@PART[liquidEngine2_v2]:NEEDS[!Restock] {
	@author = Ven
	!mesh = DELETE
	MODEL
	{
		model = VenStockRevamp/Squad/Parts/Propulsion/LVT45
		scale = 1.25, 1.25, 1.25
		position = 0, -0.94, 0
	}
	@node_stack_bottom = 0.0, -2.1, 0.0, 0, -1, 0, 1
	@MODULE[ModuleAnimateHeat]
	{
		@ThermalAnim = LV45Heat
	}
	@MODULE[ModuleGimbal]
	{
		@gimbalTransformName = Obj_Gimbal
	}
	@MODULE[ModulePartVariants]
	{
		@baseVariant = Bare
		@VARIANT[Shroud]
		{
			sizeGroup = GroupB
			mass = 0.07
			@GAMEOBJECTS
			{
				Size2A = true
			}
			NODES
			{
				node_stack_top = 0.0, 1.03, 0.0, 0, 1, 0, 2
			}			
		}
		!VARIANT[TrussMount] {}
		@VARIANT[Bare]
		{
			themeName = Bare
			sizeGroup = GroupA
			@GAMEOBJECTS
			{
				Size2A = false
			}
			NODES
			{
				node_stack_top = 0.0, 0.0, 0.0, 0, 1, 0, 2
			}
		}
	}
	!MODULE[FXModuleLookAtConstraint] {}
	MODULE
	{
		name = FXModuleLookAtConstraint
		CONSTRAINLOOKFX
		{
			targetName = Piston1
			rotatorsName = PistonBase1
		}
		CONSTRAINLOOKFX
		{
			targetName = PistonBase1
			rotatorsName = Piston1
		}
		CONSTRAINLOOKFX
		{
			targetName = Piston2
			rotatorsName = PistonBase2
		}
		CONSTRAINLOOKFX
		{
			targetName = PistonBase2
			rotatorsName = Piston2
		}
		CONSTRAINLOOKFX
		{
			targetName = Piston3
			rotatorsName = PistonBase3
		}
		CONSTRAINLOOKFX
		{
			targetName = PistonBase3
			rotatorsName = Piston3
		}
		CONSTRAINLOOKFX
		{
			targetName = Piston4
			rotatorsName = PistonBase4
		}
		CONSTRAINLOOKFX
		{
			targetName = PistonBase4
			rotatorsName = Piston4
		}
	}
}