@PART[liquidEngine3_v2]:NEEDS[!Restock] {
	@author = Ven
	!MODEL {}
	MODEL
	{
		model = VenStockRevamp/Squad/Parts/Propulsion/LV909
		scale = 1.26, 1.26, 1.26
		position = 0, -0.24, 0
	}
	@node_stack_bottom = 0.0, -0.75, 0.0, 0, -1, 0, 1
	@MODULE[ModuleGimbal]
	{
		@gimbalTransformName = Obj_Gimbal
	}
	@MODULE[ModuleJettison]
	{
		@jettisonName = fairing
	}
	@MODULE[ModulePartVariants]
	{
		@baseVariant = Bare
		!VARIANT[Shroud] {}
		!VARIANT[TrussMount] {}
		@VARIANT[Bare]
		{
			themeName = Bare
			@GAMEOBJECTS
			{
				Size2B = false
				!TallShroud = true
				!ShortShroud = false
				!Toroid = false
				!LgTruss = true
				!SmTruss = false
			}
			@NODES
			{
				node_stack_top = 0.0, 0.0, 0.0, 0, 1, 0, 1
				!node_stack_bottom = DELETE
			}
		}		
		VARIANT
		{
			name = ShroudBig
			displayName = #autoLOC_8007111 // Shroud Big
			primaryColor = #ffffff
			secondaryColor = #999999
			sizeGroup = GroupB
			mass = 0.06
			GAMEOBJECTS
			{
				Size2B = true
			}
			NODES
			{
				node_stack_top = 0.0, 0.2, 0.0, 0, 1, 0, 2
			}			
		}	
	}
	MODULE
	{
		name = FXModuleLookAtConstraint
		CONSTRAINLOOKFX
		{
			targetName = Piston1
			rotatorsName = PistonBase1
		}
		CONSTRAINLOOKFX
		{
			targetName = PistonBase1
			rotatorsName = Piston1
		}
		CONSTRAINLOOKFX
		{
			targetName = Piston2
			rotatorsName = PistonBase2
		}
		CONSTRAINLOOKFX
		{
			targetName = PistonBase2
			rotatorsName = Piston2
		}
		CONSTRAINLOOKFX
		{
			targetName = Piston3
			rotatorsName = PistonBase3
		}
		CONSTRAINLOOKFX
		{
			targetName = PistonBase3
			rotatorsName = Piston3
		}
		CONSTRAINLOOKFX
		{
			targetName = Piston4
			rotatorsName = PistonBase4
		}
		CONSTRAINLOOKFX
		{
			targetName = PistonBase4
			rotatorsName = Piston4
		}
	}
	!MODULE[FXModuleAnimateThrottle] {}
	MODULE
	{
		name = FXModuleAnimateThrottle
		animationName = HeatAnimatioEmissiveLiquidEngine3
		responseSpeed = 0.001
		dependOnEngineState = True
		dependOnThrottle = True
	}
}