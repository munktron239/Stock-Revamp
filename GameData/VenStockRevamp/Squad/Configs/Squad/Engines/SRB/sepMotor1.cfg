@PART[sepMotor1]:NEEDS[!Restock] {
 	@author = Ven
	!mesh = DELETE
	MODEL
	{
		model = VenStockRevamp/Squad/Parts/Propulsion/Sepatron
	}
	!fx_exhaustFlame_yellow_tiny = DELETE
	!sound_vent_medium = DELETE
	!sound_rocket_mini = DELETE
