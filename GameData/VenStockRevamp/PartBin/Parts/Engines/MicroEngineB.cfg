	description = #MicroEngineB_Part_description // An otherwise stock LV-1 with the tank support structure removed, which allows you to attach the engine radially. We have designated this new engine the "Fire Ant", due to an early prototype that burned down our test bulding. The Fire Ant is an otherwise stock Ant engine stripped of all of its structural supports, so use at your own risk!
